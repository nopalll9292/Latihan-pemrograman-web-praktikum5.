<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Logo Kampus</title>
  <link rel="stylesheet" href="galeri.css">
</head>
<body>
  <h2>Galeri Logo Kampus</h2>
  <div class="galeri">
    <figure>
      <img src="logo itb.png" alt="Logo ITB">
      <figcaption>Institut Teknologi Bandung</figcaption>
    </figure>
    <figure>
      <img src="logo ugm.jpg" alt="Logo UGM">
      <figcaption>Universitas Gadjah Mada</figcaption>
    </figure>
    <figure>
      <img src="logo uny.jpg" alt="Logo UNY">
      <figcaption>Universitas Negeri Yogyakarta</figcaption>
    </figure>
    <figure>
      <img src="logo ump.png" alt="Logo UMP">
      <figcaption>Universitas Muhammadiyah Purworejo</figcaption>
    </figure>
    <figure>
      <img src="logo ui.png" alt="Logo UI">
      <figcaption>Universitas Indonesia</figcaption>
    </figure>
    <figure>
      <img src="logo undip.png" alt="Logo UNDIP">
      <figcaption>Universitas Diponegoro</figcaption>
    </figure>
  </div>
</body>
</html>
